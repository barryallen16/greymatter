# Main site: jobsearch.isroot.in or VPS IP
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for md/html/js/css
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache static assets 1h, html no-cache (so tick updates + md freshness)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ico|pdf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Markdown as text with correct charset
    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # JSONL / CSV also needed for viewer? serve as text
    # Archive data: 5M, allow range requests
    location ~* \.(jsonl|csv|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Archive subpath (also works as subdomain root if you point isroot.in subdomain to /archive)
    location /archive/ {
        alias /usr/share/nginx/html/archive/;
        try_files $uri $uri/ /archive/index.html;
    }

    # SPA fallback: try file, then 404 (not redirect to index, keep 404 for missing md)
    location / {
        try_files $uri $uri/ =404;
    }

    # Health
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Grey Matter main: greymatter.isroot.in → serves job-search root (docs + archive subpath)
