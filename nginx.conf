# Archive subdomain: archive.isroot.in → same VPS, serves /archive as root
# isroot.in: create A record archive → YOUR_VPS_IP, then nginx will match server_name
server {
    listen 80;
    server_name archive.isroot.in;
    root /usr/share/nginx/html/archive;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_comp_level 6;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ico|pdf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location ~* \.(jsonl|csv|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /health {
        access_log off;
        return 200 "ok archive\n";
        add_header Content-Type text/plain;
    }
}
