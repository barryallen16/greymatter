# Main site: jobsearch.isroot.in or VPS IP
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for md/html/js/css
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache static assets 1h, html no-cache (so tick updates + md freshness)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ico|pdf|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Markdown as text with correct charset
    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # JSONL / CSV also needed for viewer? serve as text
    # Archive data: 5M, allow range requests
    location ~* \.(jsonl|csv|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Storage API (SQLite KV replacing localStorage) — proxy to api container
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        client_max_body_size 12m;
    }

    # Archive subpath (also works as subdomain root if you point isroot.in subdomain to /archive)
    location /archive/ {
        alias /usr/share/nginx/html/archive/;
        try_files $uri $uri/ /archive/index.html;
    }

    # SPA fallback: try file, then 404 (not redirect to index, keep 404 for missing md)
    location / {
        try_files $uri $uri/ =404;
    }

    # Health
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# HTTP: ACME challenge stays local, everything else → https (single-name cert)
server {
    listen 80;
    server_name greymatter.isroot.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Grey Matter main: greymatter.isroot.in → serves job-search root (docs + archive subpath)
server {
    listen 443 ssl;
    server_name greymatter.isroot.in;
    ssl_certificate /etc/letsencrypt/live/greymatter.isroot.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greymatter.isroot.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ico|pdf|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }
    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.(jsonl|csv|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        client_max_body_size 12m;
    }
    location /archive/ {
        alias /usr/share/nginx/html/archive/;
        try_files $uri $uri/ /archive/index.html;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location /health {
        access_log off;
        return 200 "ok greymatter\n";
        add_header Content-Type text/plain;
    }
}
