services:
  api:
    build: ./api
    container_name: grey-matter-api
    restart: unless-stopped
    volumes:
      - ./api/data:/app/data  # SQLite file survives rebuilds
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
  web:
    depends_on:
      - api
    build: .
    container_name: grey-matter
    ports:
      - "80:80"
      - "443:443"  # VPS: change to "80:80" or "443:443" with certbot (grey-matter.isroot.in + archive.isroot.in)
    restart: unless-stopped
    volumes:
      # thumbs are build artifacts (not in git) — scp once, served without rebuild
      - ./archive/thumbs:/usr/share/nginx/html/archive/thumbs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
