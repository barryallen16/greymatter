services:
  web:
    build: .
    container_name: grey-matter
    ports:
      - "80:80"
      - "443:443"  # VPS: change to "80:80" or "443:443" with certbot (grey-matter.isroot.in + archive.isroot.in)
    restart: unless-stopped
    volumes:
      # thumbs are build artifacts (not in git) — scp once, served without rebuild
      - ./archive/thumbs:/usr/share/nginx/html/archive/thumbs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
