[project]
name = "job-scrape"
version = "0.1.0"
description = "Daily fresher-job pipeline: X, LinkedIn guest, freehire, WhatsApp exports -> SQLite -> report.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

